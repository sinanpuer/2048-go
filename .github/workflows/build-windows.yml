name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod

      - name: Set up MinGW (needed to compile the Fyne GUI)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build GUI (Merge Kingdom)
        working-directory: gui
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -H=windowsgui" -o ../dist/MergeKingdom.exe .

      - name: Build CLI
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w" -o ../dist/2048-cli.exe .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
